<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>Video Marquee</title>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #10131a;
      --card-bg: #1b202b;
      --gap: 18px;
      --card-width: clamp(240px, 30vw, 390px);
      --card-height: clamp(380px, 24vw, 290px);
      --duration: 32s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: #f6f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      padding: 48px 0;
      overflow: hidden;
    }

    .intro {
      max-width: 760px;
      margin: 0 auto 28px;
      padding: 0 22px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      line-height: 1.15;
    }

    .intro p {
      margin: 0;
      color: #b9c0cf;
      line-height: 1.6;
    }

    .marquee-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      padding: 12px 0 22px;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 5%, #000 0%, transparent);
      mask-image: linear-gradient(to right, transparent, #000 5%, #000 0%, transparent);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      gap: var(--gap);
      animation: marquee var(--duration) linear infinite;
      will-change: transform;
    }

    .marquee-container:hover .marquee-track,
    .marquee-container:focus-within .marquee-track {
      animation-play-state: paused;
    }

    .video-wrapper {
      flex: 0 0 var(--card-width);
      height: var(--card-height);
      overflow: hidden;
      border: 1px solid #ffffff20;
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: 0 12px 32px #00000035;
      transform: scale(.96);
      opacity: .78;
      transition: transform .35s ease, opacity .35s ease, border-color .35s ease;
    }

    .video-wrapper.active-video {
      transform: scale(1);
      opacity: 1;
      border-color: #a5b4fcaa;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #080a0f;
    }

    .video-caption {
      margin: 18px auto 0;
      max-width: 760px;
      padding: 0 22px;
      text-align: center;
      color: #8f99ac;
      font-size: .9rem;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (max-width: 600px) {
      :root {
        --gap: 12px;
        --card-width: 78vw;
        --card-height: 58vw;
        --duration: 24s;
      }
      main { padding: 32px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .marquee-track {
        animation: none;
        transform: none;
      }
      .marquee-container {
        overflow-x: auto;
        -webkit-mask-image: none;
        mask-image: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <h1>Dignity, Choice &amp; Person-Centred Care</h1>
      <p>A video showcase. Hover over the strip to pause the marquee.</p>
    </header>

    <section class="marquee-container" aria-label="Video showcase">
      <div class="marquee-track" id="marqueeTrack">
        <!-- JavaScript adds the two videos twice to create a seamless loop. -->
      </div>
    </section>

    <p class="video-caption">
      If a video does not load, check that the filename and path match the uploaded file exactly.
    </p>
  </main>

  <script>
    /*
      Keep these video files beside this HTML file, or update the paths below
      to match the folder where you upload them.

      Filenames with spaces and punctuation are URL-encoded automatically.
    */
    const videos = [
      {
        title: "Dignity, choice & person-centred care",
        src: "./Dignity%2C%20choice%20%26%20person-centred%20care.mp4"
      },
      {
        title: "Dignity, choice and person-centred care",
        src: "./Dignity%2C%20choice%20and%20person-centred%20care%20.mp4"
      }
    ];

    const track = document.getElementById("marqueeTrack");
    const container = document.querySelector(".marquee-container");

    // Duplicate the sequence so the marquee can loop continuously.
    [...videos, ...videos].forEach((item, index) => {
      const wrapper = document.createElement("div");
      wrapper.className = "video-wrapper";

      const video = document.createElement("video");
      video.src = item.src;
      video.autoplay = true;
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.preload = "metadata";
      video.setAttribute("aria-label", item.title);
      video.setAttribute("title", item.title);

      // Attempt playback; browsers may block autoplay, but muted playback is usually allowed.
      video.play().catch(() => {});

      wrapper.appendChild(video);
      track.appendChild(wrapper);
    });

    // Highlight cards that are substantially visible in the viewport.
    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          entry.target.classList.toggle("active-video", entry.isIntersecting);
        });
      }, { root: container, threshold: 0.5 });

      track.querySelectorAll(".video-wrapper").forEach((element) => observer.observe(element));
    }
  </script>
</body>
</html>
