<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>Video Marquee</title>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #10131a;
      --card-bg: #1b202b;
      --gap: 18px;
      --card-width: clamp(240px, 30vw, 390px);
      --card-height: clamp(1080px, 24vw, 290px);
      --duration: 32s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: #f6f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      padding: 48px 0;
      overflow: hidden;
    }

    .intro {
      max-width: 760px;
      margin: 0 auto 28px;
      padding: 0 22px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      line-height: 1.15;
    }

    .intro p {
      margin: 0;
      color: #b9c0cf;
      line-height: 1.6;
    }

    .marquee-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      padding: 12px 0 22px;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 5%, #000 0%, transparent);
      mask-image: linear-gradient(to right, transparent, #000 5%, #000 0%, transparent);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      gap: var(--gap);
      animation: marquee var(--duration) linear infinite;
      will-change: transform;
    }

    .marquee-container:hover .marquee-track,
    .marquee-container:focus-within .marquee-track {
      animation-play-state: paused;
    }

    .video-wrapper {
      flex: 0 0 var(--card-width);
      height: var(--card-height);
      overflow: hidden;
      border: 1px solid #ffffff20;
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: 0 12px 32px #00000035;
      transform: scale(.96);
      opacity: .78;
      transition: transform .35s ease, opacity .35s ease, border-color .35s ease;
    }

    .video-wrapper.active-video {
      transform: scale(1);
      opacity: 1;
      border-color: #a5b4fcaa;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #080a0f;
    }

    .video-caption {
      margin: 18px auto 0;
      max-width: 760px;
      padding: 0 22px;
      text-align: center;
      color: #8f99ac;
      font-size: .9rem;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (max-width: 600px) {
      :root {
        --gap: 12px;
        --card-width: 78vw;
        --card-height: 58vw;
        --duration: 24s;
      }
      main { padding: 32px 0; }
    }
    .marquee-container.has-selection .marquee-track {
     animation-play-state: paused;
    }
    @media (prefers-reduced-motion: reduce) {
      .marquee-track {
        animation: none;
        transform: none;
      }
      .marquee-container {
        overflow-x: auto;
        -webkit-mask-image: none;
        mask-image: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <h1>Dignity, Choice &amp; Person-Centred Care</h1>
      <p>A video showcase. Hover over the strip to pause the marquee.</p>
    </header>

    <section class="marquee-container" aria-label="Video showcase">
      <div class="marquee-track" id="marqueeTrack">
        <!-- JavaScript adds the two videos twice to create a seamless loop. -->
      </div>
    </section>

    <p class="video-caption">
      If a video does not load, check that the filename and path match the uploaded file exactly.
    </p>
  </main>

  
<script>
const videos = [
  {
    title: "Dignity, choice & person-centred care",
    src: "./Dignity%2C%20choice%20%26%20person-centred%20care.mp4"
  },
  {
    title: "Dignity, choice and person-centred care",
    src: "./Dignity%2C%20choice%20and%20person-centred%20care%20.mp4"
  }
];

const track = document.getElementById("marqueeTrack");
const container = document.querySelector(".marquee-container");

let activeVideo = null;

// Duplicate videos for the continuous marquee.
[...videos, ...videos].forEach((item) => {
  const wrapper = document.createElement("div");
  wrapper.className = "video-wrapper";

  const video = document.createElement("video");
  video.src = item.src;
  video.autoplay = true;
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.controls = true;
  video.title = item.title;

  wrapper.appendChild(video);
  track.appendChild(wrapper);

  // Muted autoplay for the scrolling preview.
  video.play().catch(() => {});

  // Click to play with sound.
  video.addEventListener("click", async () => {
    // Clicking the active video pauses it.
    if (activeVideo === video) {
      video.pause();
      video.muted = true;
      activeVideo = null;
      container.classList.remove("has-selection");
      return;
    }

    // Stop and mute the previously selected video.
    if (activeVideo) {
      activeVideo.pause();
      activeVideo.muted = true;
      activeVideo.currentTime = 0;
    }

    // Pause and mute all other copies.
    track.querySelectorAll("video").forEach((other) => {
      if (other !== video) {
        other.pause();
        other.muted = true;
      }
    });

    activeVideo = video;
    container.classList.add("has-selection");

    video.muted = false;
    video.volume = 1;

    try {
      await video.play();
    } catch (error) {
      console.error("Could not play video with sound:", error);
    }
  });
});
</script>
</body>
</html>
